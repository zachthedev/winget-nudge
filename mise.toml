# The workflow linters and taplo, at the versions the local gate and continuous integration both
# run. One pin per tool: both legs resolve through mise, so no file has to be asserted against
# another. mise.lock records the artifact each version resolved to, and the gate reads both files.
#
# taplo's release predates GitHub's asset digests and its registry entry names no checksum file, so
# `mise lock` records no checksum for it. Its two checksum lines are the sha256 of the artifact at
# each recorded url, and a relock at the same version keeps them. On 2026-09-22 separate reads of
# each url hashed to its line. For linux-x64 they were a download through Invoke-WebRequest and one
# through curl. For windows-x64 they were a download through Invoke-WebRequest and a cold locked
# `mise install`, which accepted the line, and the taplo.exe in that zip matched the one mise
# installed on the maintainer's machine at 2026-09-20 04:25 UTC. Every read fetched GitHub's
# release asset, and no second publisher records a hash for it, so the lines rest on that asset
# alone. A bump to a release that carries a digest removes the exception.

[tools]
actionlint = "1.7.12"
shellcheck = "0.11.0"
taplo = "0.10.0"
zizmor = "1.30.1"

[settings]
# mise.lock is written as well as read, so a bump records the artifacts it resolved to.
lockfile = true
# The platforms every lockfile entry has to carry: a bump made on one machine leaves the other leg
# an artifact to install from. A bare `mise lock` then writes both, and the gate refuses an entry
# for a platform this list does not name.
lockfile_platforms = ["linux-x64", "windows-x64"]
# An install with no pre-resolved URL fails rather than resolving one of its own.
locked = true
# Every install re-verifies the attestation against the artifact rather than reading the
# provenance line mise.lock carries. Without this an install trusts any lockfile whose entry
# records a checksum and a provenance type, so the line is a claim rather than a check.
locked_verify_provenance = true
# An attestation query that cannot complete is an install error. mise defaults these two the same
# way; they are written here because a default is a thing that can change under the repository.
provenance_api_failures_fatal = true
github_attestations = true

[settings.aqua]
github_attestations = true

# mise fetches a release asset through its GitHub API address in place of the url mise.lock records
# when a HEAD on that url fails, and an asset id names no release, so nothing ties that fetch to the
# pin. This entry sends it to a host that cannot resolve, and the install fails with a DNS error for
# url-api-fallback-refused.invalid. The gate refuses any other entry here, because one would move a
# download away from the url mise.lock records, and its install carries the same entry in
# MISE_URL_REPLACEMENTS, because that variable in the environment outranks this file.
[settings.url_replacements]
'regex:^https://api\.github\.com/repos/[^/]+/[^/]+/releases/assets/.*$' = "https://url-api-fallback-refused.invalid/"

# locked_scopes is a global-only setting, so this file cannot set it and MISE_LOCKED_SCOPES can
# drop project from the scopes locked mode covers. mise enforces a config-root locked whatever that
# list says, so this is the one place locked mode cannot be lifted off this repository's tools.
[tool_config]
locked = true
