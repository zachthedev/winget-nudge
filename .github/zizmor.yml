# zizmor's settings for this repository. Every audit not named here runs at zizmor's defaults. A
# rule here can disable an audit or ignore a finding, so review reads every change to this file.
rules:
  # Every action is pinned to a commit, including the ones GitHub publishes. A tag can be
  # retargeted by its owner with no pull request and no cooldown, and this is what refuses one.
  unpinned-uses:
    config:
      policies:
        '*': hash-pin
  # zizmor asks for seven days by default. The project standard is three, which is the window that
  # catches almost every package published and then pulled while still letting a legitimate release
  # land in the same week. A shorter cooldown still fails. A cooldown block removed entirely passes
  # this audit.
  dependabot-cooldown:
    config:
      days: 3
  # An advisory published against an unchanged action pin turns every pull request's workflows
  # check red until the pin moves. A waiver is one GHSA id per entry, with a comment beside it
  # naming the advisory, what it blocks, why shipping is safer and the condition that removes it.
  # No advisory is waived.
  known-vulnerable-actions:
    config:
      allow: []
  # cd.yml's release-pr job and deps.yml's deps job each call a job that names an environment, and
  # run in none themselves, so secrets: inherit is the one form that passes that environment's
  # secret. The shared workflows job refuses an inline ignore comment, so both waivers sit here, one
  # per file. A waiver binds a file, never the workflow a job calls, so that job also runs zizmor
  # with no config. It fails unless every job passing secrets: inherit calls a zachthedev/.github
  # workflow, and it refuses a waiver that names a position or a file holding no such job.
  secrets-inherit:
    ignore:
      - cd.yml
      - deps.yml
