name: release

on:
  push:
    branches: [main]
  # Rebuilds the MSI for a release that already exists, such as one whose upload failed.
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag, such as v1.0.0
        required: true
        type: string

# No job gets a permission it does not name for itself.
permissions: {}

jobs:
  # Keeps a release pull request open against main, carrying the next version and its changelog.
  # Merging it makes release-please tag that commit and create the GitHub release as a draft. The
  # msi job below is what publishes it.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its own group, so a release waiting for an approval below never holds up the changelog.
    concurrency:
      group: release-please
      cancel-in-progress: false
    # release-pr holds the releaser app's credentials and admits only main. deployment: false,
    # because a record for every push to main would bury the ones for real releases.
    environment:
      name: release-pr
      deployment: false
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The releaser app's token, not the job token. GitHub starts no workflow from a pull request
      # the job token opens, and ci has to report on the release pull request before it can merge.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Checks the tag's shape before anything asks for an approval, so a malformed dispatch cannot
  # consume one and the approval below stays the last gate rather than the first.
  tag:
    needs: release-please
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.check.outputs.name }}
    steps:
      - id: check
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$TAG' is not a release tag such as v1.0.0."
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

  # Builds the MSI for the tag and attaches it to the release with its checksum and a build
  # provenance attestation. The release environment names a reviewer and admits only main, so a
  # merge alone publishes nothing and a dispatch from another branch cannot reach it.
  msi:
    needs: [release-please, tag]
    if: always() && needs.tag.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    # One run per tag, so two releases never race and an approval pending on one does not queue
    # behind another.
    concurrency:
      group: release-msi-${{ needs.tag.outputs.name }}
      cancel-in-progress: false
    permissions:
      # Uploading to the release.
      contents: write
      # Signing the attestation with this workflow's identity, and recording it.
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.tag.outputs.name }}
    steps:
      # refs/tags/, never the bare name: for an unqualified ref the checkout fetches both heads
      # and tags and prefers the branch, so a branch named v1.0.0 would win over the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          # The whole history, so the ancestry check below can see main.
          fetch-depth: 0
          persist-credentials: false
      # What the tag names on GitHub, against what this job checked out. A tag that moved after
      # the release was published points somewhere else, and every later check would pass: the
      # substituted commit is on main, and it carries the same version until the next release
      # pull request rewrites it.
      - name: Refuse a tag that does not name this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $reference = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG" | ConvertFrom-Json
          $target = $reference.object.sha
          if ($reference.object.type -eq 'tag') {
              $target = (gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$target" | ConvertFrom-Json).object.sha
          }

          $head = git rev-parse HEAD
          if ($head -ne $target) {
              throw "$env:TAG names $target on GitHub and this checkout is $head."
          }
      # A tag can name any commit, including one ci never checked. This job publishes whatever it
      # is given, so it refuses a commit main does not contain.
      - name: Refuse a tag that is not on main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
              throw "$env:TAG is not on main, so ci never checked it."
          }
      # No cache: a release is built from nothing a pull request could have written.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet cake.cs --target=installer
      # The MSI and the executable carry the version release-please wrote, so both have to match
      # the tag before anything is published.
      - name: Check the version and stage the assets
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          $msi = 'installer/bin/Release/WingetNudge.msi'

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase((Resolve-Path $msi).Path, 0)
          $view = $database.OpenView("SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'ProductVersion'")
          $view.Execute()
          $productVersion = $view.Fetch().StringData(1)
          $view.Close()
          if ($productVersion -ne $version) {
              throw "The MSI says $productVersion and the tag says $version."
          }

          $exe = 'src/WingetNudge/bin/Release/net10.0-windows10.0.26100.0/win-x64/publish/WingetNudge.exe'
          $fileVersion = (Get-Item $exe).VersionInfo.FileVersion
          if ($fileVersion -ne "$version.0") {
              throw "WingetNudge.exe says $fileVersion and the tag says $version."
          }

          New-Item -Path dist -ItemType Directory | Out-Null
          $asset = "WingetNudge-$version-x64.msi"
          Copy-Item -Path $msi -Destination "dist/$asset"
          $hash = (Get-FileHash -Path "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          # sha256sum's format, so `sha256sum --check` and Get-FileHash both read it.
          [System.IO.File]::WriteAllText("dist/SHA256SUMS", "$hash  $asset`n")
      # Lets a downloader ask GitHub whether the MSI came from this workflow, at this tag:
      # gh attestation verify <msi> --repo zachthedev/winget-nudge --source-ref refs/tags/<tag>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/WingetNudge-*.msi
      # release-please creates the release as a draft, so nobody can reach a release with nothing
      # on it. Publishing is the last step, after the assets and the attestation are in place.
      - name: Attach to the release and publish it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:TAG (Get-ChildItem -Path dist).FullName --clobber
          gh release edit $env:TAG --draft=false
