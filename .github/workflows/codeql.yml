name: codeql

# Code scanning as advanced setup, which is this file, rather than as default setup, which is a
# switch on the repository settings page and leaves nothing in the tree. A committed workflow is one
# a reader can audit, one Renovate pins by commit, and one the workflows job in ci.yml lints.
# Default setup pins neither the query packs nor the action versions, and a settings change there
# can rename a check the main ruleset requires, which blocks every merge.
on:
  push:
    branches: [main]
  pull_request:
  # At least once a week, so a query published after the last change to this repository still
  # reports against this tree. Thursday, clear of deps.yml's daily cron and audit.yml's.
  schedule:
    - cron: '37 9 * * 4'

permissions: {}

jobs:
  # Two languages, one analysis each in the shared workflow, which names each check run
  # Analyze (<language>) under this job. GitHub also detects JavaScript here, and it is not
  # analyzed: the only JavaScript in the tree is commitlint.config.js, tooling rather than code the
  # MSI carries.
  #
  # csharp runs on Linux with build-mode none, which extracts every C# source without building the
  # solution. Dependency resolution is best effort on either runner. The called job turns GitHub's
  # disable_csharp_buildless flag off, so C# never falls back to autobuild. Autobuild of this
  # solution fails on Linux.
  # actions on the default runner reads the workflows under .github; the workflows job in ci.yml
  # reads the same files with actionlint and zizmor, and CONTRIBUTING.md says which covers what.
  # The calling job grants what the called job declares.
  codeql:
    permissions:
      security-events: write
      contents: read
      actions: read
    uses: zachthedev/.github/.github/workflows/codeql.yml@ec458567a7200c4ad96ed0c7556e06bc2b287738 # v0.3.0
    with:
      languages: '[{"language": "csharp", "runs-on": "ubuntu-latest"}, {"language": "actions"}]'
      global-json-file: global.json
