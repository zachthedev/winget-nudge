name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so an advisory published against an action this repository has not changed still
  # reaches the online zizmor audits below, and the advisories job reports every NuGet advisory
  # against the committed package graph.
  schedule:
    - cron: "23 7 * * 1"

# The token can read the checkout and nothing else, so a compromised action on a runner cannot
# push, release or write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a commit. A tag can be retargeted by its owner with no pull request and
# no cooldown; a commit cannot. Renovate bumps the hash and keeps the version comment current.
#
# The workflow linters come from mise. mise.toml carries the version of each one and mise.lock
# carries the artifact that version resolved to, so both jobs below and a local gate run install
# the same bytes from the same two files. .github/mise-bootstrap.json pins mise itself, and the
# SHA-256 of its binary on each platform.
jobs:
  # The code half of the gate: cake.cs's code target, the same one a contributor runs before a push.
  # The WinUI app and the MSI build only on Windows.
  gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # This job pushes nothing, so the job token does not stay in the checkout for the steps
      # that follow it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # package.json's packageManager field is the one Bun version pin.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: dotnet tool restore
      # The code target reaches no linter. The linters install here anyway, so a lockfile whose
      # windows-x64 entries cannot install fails on this leg rather than on a contributor's machine.
      - name: mise pin
        id: pin
        shell: bash
        run: |
          jq -r '"version=" + .version' .github/mise-bootstrap.json >> "$GITHUB_OUTPUT"
          jq -r '"sha256=" + .sha256["windows-x64"]' .github/mise-bootstrap.json >> "$GITHUB_OUTPUT"
      # cache: false on both legs. The action saves a cache only when it installs, and it installs
      # on neither, so the input writes nothing and a restored cache would reach the install below
      # without the action knowing it had.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ steps.pin.outputs.version }}
          install: false
          cache: false
      - name: mise binary
        shell: bash
        env:
          WANT: ${{ steps.pin.outputs.sha256 }}
        run: |
          got=$(sha256sum "$(command -v mise)" | cut -d ' ' -f 1)
          if [ "$got" != "$WANT" ]; then
            echo "mise on disk hashes $got, and .github/mise-bootstrap.json records $WANT" >&2
            exit 1
          fi
      # MISE_LOCKED_VERIFY_PROVENANCE here as well as on the workflows job, so the windows-x64
      # entries are re-verified against their attestations on the leg that installs them. mise.toml
      # sets the same value, and this repeats it so the job does not depend on the file being read.
      - name: Linters
        env:
          MISE_LOCKED_VERIFY_PROVENANCE: "1"
        run: mise install
      - run: dotnet cake.cs --target=code

  # The workflows half of the gate, from the linters mise.toml pins. cake.cs's workflows target
  # runs the same versions locally, out of the same lockfile.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mise pin
        id: pin
        run: |
          jq -r '"version=" + .version' .github/mise-bootstrap.json >> "$GITHUB_OUTPUT"
          jq -r '"sha256=" + .sha256["linux-x64"]' .github/mise-bootstrap.json >> "$GITHUB_OUTPUT"
      # cache: false so the install below starts cold and re-verifies every artifact. The action
      # also exports MISE_TRUSTED_CONFIG_PATHS for the checkout, so mise.toml's settings are in
      # force for every step after this one without a mise trust of its own.
      # The gate job says the rest of why neither job caches.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ steps.pin.outputs.version }}
          install: false
          cache: false
      # The action checks its download against the release's minisign-signed SHASUMS256.txt. This
      # step checks the binary on disk against the hash this repository records, which is the leg
      # the repository controls. Every archive the action can pick carries the same binary, so one
      # hash covers them all.
      - name: mise binary
        env:
          WANT: ${{ steps.pin.outputs.sha256 }}
        run: |
          got=$(sha256sum "$(command -v mise)" | cut -d ' ' -f 1)
          if [ "$got" != "$WANT" ]; then
            echo "mise on disk hashes $got, and .github/mise-bootstrap.json records $WANT" >&2
            exit 1
          fi
      # MISE_LOCKED_VERIFY_PROVENANCE makes this install re-verify each attestation against the
      # artifact mise.lock records, rather than trusting the run that wrote the lockfile. This is
      # the step that makes the attestation a check on every pull request instead of a claim.
      - name: Linters
        env:
          MISE_LOCKED_VERIFY_PROVENANCE: "1"
        run: mise install
      # -shellcheck names the pinned binary rather than letting actionlint pick one off PATH.
      # -pyflakes= because no Windows package manager ships a pinned pyflakes, and a pass that runs
      # on one leg alone reports findings a contributor cannot reproduce.
      - name: actionlint
        run: mise exec -- actionlint -pyflakes= -shellcheck="$(mise which shellcheck)"
      # Online here and offline in a local run. zizmor's online audits, such as a pinned commit that
      # is not in its action's repository, need a token, and the job token costs nothing.
      # --strict-collection fails on a file zizmor cannot parse rather than dropping it and
      # reporting no findings for a workflow it never read.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise exec -- zizmor --no-progress --strict-collection --config .github/zizmor.yml
          .github/workflows

  # Only on a pull request, because the ruleset on main admits nothing else. A direct push would
  # carry subjects release-please reads and commitlint never saw.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bunx --no-install commitlint --from "$BASE" --to "$HEAD"
      # A squash merge of a pull request with several commits takes the title as its subject, so
      # the title lands on main and is held to the same rules. Renovate's titles stay inside the
      # limit, which the commit message template in .github/renovate.json is what keeps true.
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | bunx --no-install commitlint

  # Diffs GitHub's dependency graph between the base and the head of a pull request, and fails on a
  # high or critical advisory against a package the pull request adds or moves. A package the pull
  # request leaves alone passes here whatever is published against it: the advisories job below and
  # the restore audit in Directory.Build.props are what report those. Every scope is named because
  # the default blocks runtime alone, and every npm package here is a development dependency.
  #
  # The graph reads package.json and the workflows. It reads each csproj too, where Central Package
  # Management leaves no version, so it records every NuGet package as ">= 0" and a bump in
  # Directory.Packages.props changes nothing it can see. NU1903 and NU1904 at restore are the NuGet
  # gate. The action reads the working tree only for a config-file input, so there is no checkout.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown

  # The weekly NuGet advisory report. Directory.Build.props lets NU1900, NU1901, NU1902 and NU1905
  # warn rather than fail, and this job is what keeps exempt from meaning ignored. The restore runs
  # with AuditPipeline=false, so no advisory fails it. The listing then prints every advisory
  # against the locked graph, transitive packages included, and exits 0 with findings. It exits 1
  # only when it cannot reach the vulnerability data, so a report that never ran cannot read green.
  advisories:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore WingetNudge.slnx -p:RestoreLockedMode=true -p:AuditPipeline=false
      # --no-restore, because the implicit restore would run without the property above and fail
      # on the very advisory this job exists to report. The summary gets the same text in a fence.
      - name: Advisories
        shell: bash
        run: |
          dotnet package list --project WingetNudge.slnx --vulnerable --include-transitive \
            --no-restore | tee advisories.txt
          printf '~~~\n%s\n~~~\n' "$(cat advisories.txt)" >> "$GITHUB_STEP_SUMMARY"
