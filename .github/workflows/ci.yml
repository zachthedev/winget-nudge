name: ci

on:
  push:
    branches: [main]
  pull_request:

# The token can read the checkout and nothing else, so a compromised action on a runner cannot
# push, release or write to the repository. The snapshot job is the one exception, and it says why.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a commit. A tag can be retargeted by its owner with no pull request and
# no cooldown; a commit cannot. Renovate bumps the hash and keeps the version comment current.
#
# The workflow linters come from mise. mise.toml carries the version of each one and mise.lock
# carries the artifact that version resolved to, so both jobs below and a local gate run install
# the same bytes from the same two files. Both jobs install through cake.cs's tools target, which
# asserts those two files and then runs the install, so the order is a dependency in that file and
# not a step order here. jdx/mise-action pins mise itself on its version line and verifies the
# download against the release's minisign-signed checksums.
jobs:
  # The code half of the gate: cake.cs's code target, the same one a contributor runs before a push.
  # The WinUI app and the MSI build only on Windows.
  gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # This job pushes nothing, so the job token does not stay in the checkout for the steps
      # that follow it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # package.json's packageManager field is the one Bun version pin.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: dotnet tool restore
      # The code target reaches no linter. The linters install here anyway, so a lockfile whose
      # windows-x64 entries cannot install fails on this leg rather than on a contributor's machine.
      # cache: false on both legs. The action saves a cache only when it installs, and it installs
      # on neither, so the input writes nothing and a restored cache would reach the install below
      # without the action knowing it had.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
          install: false
          cache: false
      # The tools target asserts mise.lock against mise.toml and cake.cs's pins, then runs mise
      # install with MISE_LOCKED_VERIFY_PROVENANCE set, so the windows-x64 entries are re-verified
      # against their attestations on the leg that installs them. An entry whose address is not the
      # repository cake.cs names is refused before the install fetches from it.
      - name: Linters
        run: dotnet cake.cs --target=tools
      - run: dotnet cake.cs --target=code

  # The workflows half of the gate, from the linters mise.toml pins. cake.cs's workflows target
  # runs the same versions locally, out of the same lockfile.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The SDK global.json names, for the one cake target this job runs. That target restores
      # Cake.Sdk alone, so there is no package graph to key a cache on.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # cache: false so the install below starts cold and re-verifies every artifact. The action
      # also exports MISE_TRUSTED_CONFIG_PATHS for the checkout, so mise.toml's settings are in
      # force for every step after this one without a mise trust of its own.
      # The gate job says the rest of why neither job caches.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
          install: false
          cache: false
      # The same tools target as the gate job: the lockfile assertions, then mise install with
      # MISE_LOCKED_VERIFY_PROVENANCE set, so each attestation is re-verified against the artifact
      # mise.lock records rather than trusted from the run that wrote the lockfile. This is the step
      # that makes the attestation a check on every pull request instead of a claim.
      - name: Linters
        run: dotnet cake.cs --target=tools
      # -shellcheck names the pinned binary rather than letting actionlint pick one off PATH.
      # -pyflakes= because no Windows package manager ships a pinned pyflakes, and a pass that runs
      # on one leg alone reports findings a contributor cannot reproduce.
      - name: actionlint
        run: mise exec -- actionlint -pyflakes= -shellcheck="$(mise which shellcheck)"
      # Online here, as a local run is whenever gh holds a token. zizmor's online audits, such as a
      # pinned commit that is not in its action's repository, need one, and the job token costs
      # nothing.
      # --strict-collection fails on a file zizmor cannot parse rather than dropping it and
      # reporting no findings for a workflow it never read.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          mise exec -- zizmor --no-progress --strict-collection --config .github/zizmor.yml
          .github/workflows

  # Only on a pull request, because the ruleset on main admits nothing else. A direct push would
  # carry subjects release-please reads and commitlint never saw.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bunx --no-install commitlint --from "$BASE" --to "$HEAD"
      # A squash merge of a pull request with several commits takes the title as its subject, so
      # the title lands on main and is held to the same rules. Renovate's titles stay inside the
      # limit, which the commit message template in .github/renovate.json is what keeps true.
      - name: Pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | bunx --no-install commitlint

  # The NuGet graph of the restored tree as an SPDX file. GitHub's graph reads each csproj alone
  # and never Directory.Packages.props, so without a snapshot every NuGet package reads ">= 0" and
  # a bump is invisible to dependency-review below. The SBOM tool is the stack's own pin in
  # dotnet-tools.json, Microsoft-signed on nuget.org, and it reads the project.assets.json files a
  # restore writes, which is why one runs first. This job holds the read token alone: the restore
  # and the tool run third-party code, and the write the submission needs lives in the next job,
  # which runs nothing but the pinned submission action over this job's artifact.
  sbom:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet tool restore
      - run: dotnet restore WingetNudge.slnx -p:RestoreLockedMode=true
      - run: dotnet sbom-tool generate -b . -bc . -pn winget-nudge -pv 0.0.0 -ps zachthedev -nsb https://zachthe.dev -m sbom
      # A tool that found no project.assets.json exits 0 with a hollow file, and a snapshot with
      # no packages passes the review on ">= 0" as if nothing ran. The solution restores more
      # packages than this, so a count below it is a run that read nothing.
      - run: jq -e '(.packages | length) > 10' sbom/_manifest/spdx_2.2/manifest.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/_manifest/spdx_2.2/manifest.spdx.json
          if-no-files-found: error

  # Submits that SPDX file as the dependency snapshot for this head. contents: write is what the
  # submission API needs; the key raises a Dependabot pull request's read-only token too. A fork's
  # token cannot be raised, so the sbom job above runs for heads this repository owns alone and a
  # fork pull request keeps the review below over what the graph reads. No checkout: repoSha and
  # repoRef name the commit, and the action reads the file and downloads nothing.
  snapshot:
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
      - uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
        with:
          filePath: sbom
          manifestPath: Directory.Packages.props
          repoSha: ${{ github.event.pull_request.head.sha || github.sha }}
          repoRef: refs/heads/${{ github.head_ref || github.ref_name }}

  # Diffs GitHub's dependency graph between the base and the head of a pull request, and fails on a
  # high or critical advisory against a package the pull request adds or moves. A package the pull
  # request leaves alone passes here whatever is published against it: the restore audit in
  # Directory.Build.props and the weekly audit workflow are what report those. Every scope is
  # named because the default blocks runtime alone, and every npm package here is a development
  # dependency.
  #
  # The graph reads package.json and the workflows. It reads each csproj too, where Central Package
  # Management leaves no version, so it records every NuGet package as ">= 0" and a bump in
  # Directory.Packages.props changes nothing it can see; the snapshot job above is what puts real
  # NuGet versions in front of this compare. The action reads the working tree only for a
  # config-file input, so there is no checkout.
  # !cancelled(), so a fork pull request whose snapshot job did not run still gets the review over
  # package.json and the workflows, with NuGet reading ">= 0" there as it did before the snapshot.
  # A snapshot that failed is another matter: the compare would read ">= 0" and pass, so the first
  # step refuses to review behind a failed snapshot.
  dependency-review:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: needs.snapshot.result == 'failure'
        run: |
          echo 'The snapshot job failed, so this compare would read every NuGet package as ">= 0".' >&2
          exit 1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          # The submission API indexes a snapshot after it answers, and a compare that runs first
          # falls back to the manifest graph, where every NuGet package reads ">= 0" and passes.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 300
