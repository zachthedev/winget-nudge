name: ci

# Everything that judges a pull request and a push to main: the gate on Windows, the commit
# messages, the workflow linters, the NuGet snapshot and the advisory check. The three shared jobs
# call the reusable workflows in zachthedev/.github, pinned by commit with the version beside it.
on:
  push:
    branches: [main]
  pull_request:

# No job gets a permission it does not name for itself. Each calling job grants what its called
# job declares. The snapshot job is the one write, and it says why.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The four settings that leave mise reading mise.toml alone, for every mise call a step here makes
# outside the gate. The gate sets them again on each mise it starts. A called workflow gets none of
# these, so the shared jobs set their own.
env:
  MISE_OVERRIDE_CONFIG_FILENAMES: mise.toml
  MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: none
  MISE_ENV: ''
  MISE_AUTO_ENV: 'false'

# Every action is pinned to a commit. A tag can be retargeted by its owner with no pull request and
# no cooldown; a commit cannot. Renovate bumps the hash and keeps the version comment current.
jobs:
  # The whole gate, the same command a contributor runs before a push. Windows alone: the app is
  # WinUI 3 and the installer is a WiX MSI, and neither builds on darwin or linux. The tools come
  # from mise: mise.toml carries the version of each one and mise.lock carries the artifact that
  # version resolved to, so this job, the workflows job below and a local run install the same
  # bytes from the same two files. jdx/mise-action pins mise itself on its version line and
  # verifies the download against the release's minisign-signed checksums.
  gate:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # install: false, because the tools target asserts mise.lock before it installs from it, and
      # an install here would put the bytes on disk before the assertions read the file. cache:
      # false for the same reason: nothing restored ahead of the assertions. github_token: '',
      # because the action otherwise exports the job token as MISE_GITHUB_TOKEN to every later
      # step. version: pins mise, so the action looks up no release, and a locked install asks the
      # GitHub API for nothing. env: false and export_path: false, because either one runs mise env
      # over the checkout's mise.toml and hands later steps what it produces. The action still puts
      # its own bin directory on PATH, outside the workspace. It runs ahead of checkout: its mise
      # --version and mise ls read the workspace's mise.toml and evaluate its [env] and [vars]
      # templates, and before checkout there is none.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.11
          install: false
          cache: false
          github_token: ''
          env: false
          export_path: false
      # This job pushes nothing, so the job token does not stay in the checkout for the steps
      # that follow it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      # package.json's packageManager field is the one Bun version pin.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # --ignore-scripts, because bun install runs package.json's own lifecycle scripts under a
      # frozen lockfile too, and this job needs none. The root prepare writes git hooks, and
      # lefthook's postinstall does nothing when CI is set.
      - run: bun install --frozen-lockfile --ignore-scripts
      # --tool-manifest names the root manifest. Without it the restore reads a
      # .config/dotnet-tools.json first, which the gate refuses only after this step.
      - run: dotnet tool restore --tool-manifest dotnet-tools.json
      # tools is the install, held behind the lockfile assertions in cake.cs: it asserts mise.lock
      # against mise.toml and cake.cs's pins, then runs mise install with the attestations
      # re-verified, so an entry whose address is not the repository cake.cs names is refused
      # before the install fetches from it. The second line is the whole gate a contributor runs.
      # Neither step holds a token: the gate sees CI and runs zizmor --offline, and the shared
      # workflows job runs the online audits.
      - run: dotnet cake.cs --target=tools
      - run: dotnet cake.cs

  commits:
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/commits.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0

  # The workflow linters on Linux, from the same lockfile. Its install covers every tool mise.toml
  # pins, taplo included, so an entry only one platform can install fails on a pull request rather
  # than on a contributor's machine.
  workflows:
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/workflows.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0

  # The NuGet graph of the restored tree as an SPDX file. GitHub's graph reads each csproj alone
  # and never Directory.Packages.props, so without a snapshot every NuGet package reads ">= 0" and
  # a bump is invisible to dependency-review below. The SBOM tool is the stack's own pin in
  # dotnet-tools.json, Microsoft-signed on nuget.org, and it reads the project.assets.json files a
  # restore writes, which is why one runs first. This job holds the read token alone: the restore
  # and the tool run third-party code, and the write the submission needs lives in the next job,
  # which runs nothing but the pinned submission action over this job's artifact.
  sbom:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet tool restore --tool-manifest dotnet-tools.json
      # The restore names the root Directory files, imports no Directory.Solution file and reads no
      # response file, as the gate's build rows do, so the graph this job submits is the one the
      # gate builds. GITHUB_WORKSPACE is the checkout's absolute path on the runner.
      - run: >-
          dotnet restore WingetNudge.slnx -p:RestoreLockedMode=true
          -p:DirectoryBuildPropsPath="$GITHUB_WORKSPACE/Directory.Build.props"
          -p:DirectoryBuildTargetsPath="$GITHUB_WORKSPACE/Directory.Build.targets"
          -p:DirectoryPackagesPropsPath="$GITHUB_WORKSPACE/Directory.Packages.props"
          -p:ImportDirectorySolutionProps=false -p:ImportDirectorySolutionTargets=false
          -noAutoResponse
      # The tool refuses an output directory that does not exist.
      - run: mkdir sbom && dotnet sbom-tool generate -b . -bc . -pn winget-nudge -pv 0.0.0 -ps zachthedev -nsb https://zachthe.dev -m sbom
      # A tool that found no project.assets.json exits 0 with a hollow file, and a snapshot with
      # no packages passes the review on ">= 0" as if nothing ran. The solution restores more
      # packages than this, so a count below it is a run that read nothing.
      - run: jq -e '(.packages | length) > 10' sbom/_manifest/spdx_2.2/manifest.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/_manifest/spdx_2.2/manifest.spdx.json
          if-no-files-found: error

  # Submits that SPDX file as the dependency snapshot for this head. contents: write is what the
  # submission API needs; the key raises a Dependabot pull request's read-only token too. A fork's
  # token cannot be raised, so the sbom job above runs for heads this repository owns alone and a
  # fork pull request keeps the review below over what the graph reads. No checkout: repoSha and
  # repoRef name the commit, and the action reads the file and downloads nothing.
  snapshot:
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom
      - uses: advanced-security/spdx-dependency-submission-action@b009efcf8b9d562a4569d2028c276522232e631f # v0.4.0
        with:
          filePath: sbom
          manifestPath: Directory.Packages.props
          repoSha: ${{ github.event.pull_request.head.sha || github.sha }}
          repoRef: refs/heads/${{ github.head_ref || github.ref_name }}

  # Diffs GitHub's dependency graph between the base and the head of a pull request, and again
  # between the last release tag and the head of the release pull request. It fails on a high or
  # critical advisory against a package the pull request adds or moves. A package the pull request
  # leaves alone passes here whatever is published against it: the restore audit in
  # Directory.Build.props and the weekly audit workflow are what report those. The graph reads
  # package.json and the workflows; for NuGet it reads each csproj, where Central Package Management
  # leaves no version, so the snapshot job above is what puts real NuGet versions in front of this
  # compare. !cancelled(), so a fork pull request whose snapshot did not run still gets the review
  # over package.json and the workflows, with NuGet reading ">= 0" there as it did before the
  # snapshot. The calling job grants what the called job declares.
  dependency-review:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: snapshot
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/dependency-review.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0
