name: audit

# The whole-tree reports, on one daily clock. A red run is a report, never a check: it means work
# to pick up. Nothing merges, releases or deploys through this file. The pull request checks in
# ci.yml hold what a change adds. This file reports what the world found about the tree since.
#
# The package.json audit script runs bun audit, which reads every package in bun.lock, transitives
# included, against the live database and exits non-zero at or above the script's audit level. The
# work is a direct bump through Renovate's next security fix or a transitive one by hand with bun
# audit fix.
#
# The nuget job lists every NuGet advisory against the locked graph, whatever its severity.
#
# The workflows job runs zizmor's online audits over the pinned actions: a pinned commit outside
# its action's repository, a stale action ref, a known-vulnerable action. Those answers change
# with no pull request, so a schedule is what asks again.
on:
  schedule:
    # At least once a day. The hour is clear of deps.yml's cron.
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # bun audit reads bun.lock, so the job needs Bun and no install.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The verdict is a claim about an external database, and a clean verdict names no
      # endpoint. bun audit has no --registry flag, and this variable outranks bunfig.toml and
      # a dotenv, so setting it here fixes the endpoint for the run. The script, not bare bun audit,
      # so its --audit-level and every --ignore waiver it carries apply to the daily report too.
      - run: bun run audit
        env:
          BUN_CONFIG_REGISTRY: https://registry.npmjs.org/

  # The C# half of the report, a job of its own so neither report waits on the other. The restore
  # runs on Linux because Directory.Build.props enables the Windows target there.
  nuget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Directory.Build.props lets every audit code warn, so the restore reports and never fails.
      - run: dotnet restore WingetNudge.slnx -p:RestoreLockedMode=true
      # The listing prints every advisory against the locked graph, transitive packages included,
      # and exits 0 with findings. It exits 1 only when it cannot reach the vulnerability data, so
      # a report that never ran cannot read green. The summary gets the same text in a fence.
      # shell: bash runs with pipefail, so a listing that fails fails the step through the tee.
      - name: Advisories
        shell: bash
        run: |
          dotnet package list --project WingetNudge.slnx --vulnerable --include-transitive \
            --no-restore | tee advisories.txt
          printf '~~~\n%s\n~~~\n' "$(cat advisories.txt)" >> "$GITHUB_STEP_SUMMARY"

  # The calling job grants what the called job declares.
  workflows:
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/workflows.yml@ec458567a7200c4ad96ed0c7556e06bc2b287738 # v0.3.0
