name: audit

# The whole-tree reports, on their own clock. A red run is a report, never a check: it means work
# to pick up rather than a change refused. Nothing merges, releases or deploys through this file.
# The pull request checks in ci.yml hold what a change adds. This file reports what the world
# found about the tree since.
#
# audit lists every NuGet advisory against the locked graph, whatever its severity. workflows runs
# zizmor's online audits over the pinned actions: a pinned commit outside its action's repository,
# a stale action ref, a known-vulnerable action. Those answers change with no pull request, so a
# schedule is what asks again.
on:
  schedule:
    # Weekly, Monday, clear of the deps and CodeQL crons. The audit job's if: names this string.
    - cron: '23 7 * * 1'
    # Weekly, an hour later. The workflows job's if: names this string.
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  # The first weekly clock, and every dispatch. The schedule context carries the cron that fired.
  audit:
    if: github.event_name != 'schedule' || github.event.schedule == '23 7 * * 1'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # Directory.Build.props lets every audit code warn, so the restore reports and never fails.
      - run: dotnet restore WingetNudge.slnx -p:RestoreLockedMode=true
      # The listing prints every advisory against the locked graph, transitive packages included,
      # and exits 0 with findings. It exits 1 only when it cannot reach the vulnerability data, so
      # a report that never ran cannot read green. The summary gets the same text in a fence.
      - name: Advisories
        shell: bash
        run: |
          dotnet package list --project WingetNudge.slnx --vulnerable --include-transitive \
            --no-restore | tee advisories.txt
          printf '~~~\n%s\n~~~\n' "$(cat advisories.txt)" >> "$GITHUB_STEP_SUMMARY"

  # The second weekly clock, and every dispatch. The calling job grants what the called job
  # declares. The called workflow installs from mise.lock, so no install step of this repository's
  # own runs here.
  workflows:
    if: github.event_name != 'schedule' || github.event.schedule == '23 8 * * 1'
    permissions:
      contents: read
    uses: zachthedev/.github/.github/workflows/workflows.yml@c53d09e393028ceddee0d761f2a7963394289a72 # v0.1.0
