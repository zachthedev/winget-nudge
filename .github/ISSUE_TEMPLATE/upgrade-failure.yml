name: Upgrade failure
description: A package failed to upgrade, or an app it closed did not come back.
title: 'upgrade: '
labels: ['bug', 'upgrade']
body:
  - type: markdown
    attributes:
      value: |
        Try the same upgrade in a terminal first. When winget fails the same way there, the
        problem is winget's or the package's, and the links on the previous page lead to them.
  - type: input
    id: package
    attributes:
      label: Package id
      description: The winget id, as the card shows it.
      placeholder: 'Git.Git'
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: The installed version and the one offered.
      placeholder: '2.47.0 to 2.48.1'
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: The failure on the card
      description: The text the card showed, including any error code.
      render: text
    validations:
      required: true
  - type: dropdown
    id: terminal
    attributes:
      label: Does `winget upgrade --id <id> --exact` succeed in a terminal?
      description: Run it as the same user. Pick "Not tried" rather than guessing.
      options:
        - 'Yes'
        - 'No, it fails the same way'
        - 'No, it fails differently'
        - Not tried
    validations:
      required: true
  - type: dropdown
    id: running
    attributes:
      label: Was the app running during the upgrade?
      options:
        - 'Yes, and Winget Nudge asked to close it'
        - 'Yes, and nothing asked'
        - 'No'
        - Not sure
    validations:
      required: true
  - type: textarea
    id: installer_log
    attributes:
      label: Installer log
      description: >
        The newest `%LOCALAPPDATA%\WingetNudge\installer-logs\<id>_*.log`, when one exists. Remove
        anything in it you would rather not publish.
      render: text
  - type: input
    id: version
    attributes:
      label: Winget Nudge version
      placeholder: '1.0.0, or 6f9be1d'
    validations:
      required: true
  - type: input
    id: winget_version
    attributes:
      label: winget version
      placeholder: 'v1.29.290'
    validations:
      required: true
